<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PDA COMERCIAL - Qualidade e variedade para si</title>

    <!-- SEO -->
    <meta
      name="description"
      content="PDA COMERCIAL - Qualidade e variedade para si. Compre online com entrega rápida em Huíla (Lubango) e Cunene (Ondjiva) com pagamento na entrega."
    />

    <meta
      name="application-name"
      content="PDA COMERCIAL"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="PDA COMERCIAL"
    />

    <meta
      name="theme-color"
      content="#062b5c"
    />

    <!-- PWA Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- URL principal do site -->
    <link
      rel="canonical"
      href="https://pda-comercial.vercel.app/"
    />

    <!-- =====================================================
         OPEN GRAPH
         Facebook / WhatsApp / Messenger / outras redes
         ===================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://pda-comercial.vercel.app/"
    />

    <meta
      property="og:title"
      content="PDA COMERCIAL - Loja Online"
    />

    <meta
      property="og:description"
      content="Qualidade e variedade para si. Encontre produtos de qualidade com entrega rápida e pagamento na entrega."
    />

    <!-- Imagem da pré-visualização -->
    <meta
      property="og:image"
      content="https://pda-comercial.vercel.app/og-image.jpg"
    />

    <meta
      property="og:image:type"
      content="image/jpeg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="675"
    />

    <meta
      property="og:site_name"
      content="PDA COMERCIAL"
    />

    <meta
      property="og:locale"
      content="pt_AO"
    />

    <!-- =====================================================
         TWITTER / X
         ===================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:url"
      content="https://pda-comercial.vercel.app/"
    />

    <meta
      name="twitter:title"
      content="PDA COMERCIAL - Loja Online"
    />

    <meta
      name="twitter:description"
      content="Qualidade e variedade para si. Compre online com entrega rápida em Huíla e Cunene."
    />

    <meta
      name="twitter:image"
      content="https://pda-comercial.vercel.app/og-image.jpg"
    />

    <!-- =====================================================
         SCHEMA.ORG / GOOGLE
         Dados estruturados da loja
         ===================================================== -->

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "name": "PDA COMERCIAL",
      "alternateName": "PDA Comercial Angola",
      "url": "https://pda-comercial.vercel.app/",
      "description": "PDA COMERCIAL - Qualidade e variedade para si. Loja online com entrega em Huíla e Cunene.",
      "currenciesAccepted": "AOA",
      "paymentAccepted": "Cash, Multicaixa Express",
      "areaServed": [
        {
          "@type": "AdministrativeArea",
          "name": "Huíla"
        },
        {
          "@type": "AdministrativeArea",
          "name": "Cunene"
        }
      ]
    }
    </script>

  </head>

  <body>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>

  </body>
</html>
